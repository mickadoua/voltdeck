name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

# Groupe par tag : deux versions différentes ne s'annulent jamais ; un tag repoussé annule son run précédent.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Publie l'APK signé sous un nom fixe : releases/latest/download/voltdeck.apk reste valable d'une version à l'autre.
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Le tag correspond à versionName
        run: |
          version=$(sed -n 's/^ *versionName = "\(.*\)"$/\1/p' composeApp/build.gradle.kts)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME mais versionName $version dans composeApp/build.gradle.kts"
            exit 1
          fi
      - name: Contrôles de lecture seule et anti-secret
        run: scripts/ci/check-readonly.sh && scripts/ci/check-secrets.sh
      - name: Tests, lint et contrôles du manifest
        run: ./gradlew check --stacktrace
      - name: Clé de signature
        env:
          KEYSTORE_BASE64: ${{ secrets.VOLTDECK_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret VOLTDECK_KEYSTORE_BASE64 absent : impossible de signer l'APK."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
      - name: APK signé
        env:
          VOLTDECK_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          VOLTDECK_KEYSTORE_PASSWORD: ${{ secrets.VOLTDECK_KEYSTORE_PASSWORD }}
          VOLTDECK_KEY_ALIAS: ${{ secrets.VOLTDECK_KEY_ALIAS }}
          VOLTDECK_KEY_PASSWORD: ${{ secrets.VOLTDECK_KEY_PASSWORD }}
        run: |
          ./gradlew :composeApp:assembleRelease --stacktrace
          cp composeApp/build/outputs/apk/release/composeApp-release.apk voltdeck.apk
      - name: Release GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" voltdeck.apk --title "Voltdeck $GITHUB_REF_NAME" --generate-notes
