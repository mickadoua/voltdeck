name: CI

# Automatique sur les PR prêtes (pas les brouillons), hors changements de doc seule :
# seulement les contrôles rapides (lecture seule, anti-secret). Aucun run sur un push de branche.
# Les tests sont lancés en local avant de pousser (CLAUDE.md) ; ici, à la demande seulement.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - LICENSE
      - NOTICE
  workflow_dispatch:
    inputs:
      ios:
        description: "Lancer aussi les tests iOS (simulateur, runner macOS)"
        type: boolean
        default: false

permissions:
  contents: read

# Un nouveau push sur la même PR (ou un nouveau lancement sur la même branche) annule le run en cours.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Verrous de lecture seule et anti-secret : rapides, sans Gradle, pour un rouge lisible.
  guards:
    # PR en brouillon : rien. Lancement manuel : toujours.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Les contrôles échouent quand ils le doivent
        run: scripts/ci/selftest.sh
      - name: Aucune écriture BLE hors de KableTransport.kt
        run: scripts/ci/check-readonly.sh
      - name: Aucun secret ni adresse MAC dans le dépôt
        run: scripts/ci/check-secrets.sh

  # À la demande : Actions > CI > Run workflow.
  android:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      # `check` inclut les tests unitaires, le lint et le contrôle « aucune permission INTERNET » du manifest fusionné.
      - name: Tests, lint et contrôles du manifest
        run: ./gradlew check --stacktrace
      - name: APK debug
        run: ./gradlew :composeApp:assembleDebug --stacktrace
      # Non bloquant : le quota d'artefacts du compte est atteint (calcul de facturation GitHub, VOL-4).
      # L'APK debug est alors joint à la tâche depuis une build locale.
      - name: Contrôle de l'APK debug
        run: ls composeApp/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: upload-apk
        continue-on-error: true
        with:
          name: voltdeck-debug-apk
          path: composeApp/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 1
      - name: Avertissement si l'APK n'a pas pu être publié
        if: steps.upload-apk.outcome == 'failure'
        run: echo "::warning title=APK non publié::L'upload de l'artefact a échoué (quota GitHub ?). Le job reste vert, mais aucun APK n'est téléchargeable depuis la CI."
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        continue-on-error: true
        with:
          name: test-reports
          path: "**/build/reports/"
          if-no-files-found: ignore
          retention-days: 7

  # À la demande seulement, case « ios » cochée.
  ios:
    if: github.event_name == 'workflow_dispatch' && inputs.ios
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Tests iOS (simulateur)
        run: ./gradlew iosSimulatorArm64Test --stacktrace
