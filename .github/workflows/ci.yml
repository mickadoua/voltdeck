name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Verrous de lecture seule et anti-secret : rapides, sans Gradle, pour un rouge lisible.
  guards:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Les contrôles échouent quand ils le doivent
        run: scripts/ci/selftest.sh
      - name: Aucune écriture BLE hors de KableTransport.kt
        run: scripts/ci/check-readonly.sh
      - name: Aucun secret ni adresse MAC dans le dépôt
        run: scripts/ci/check-secrets.sh

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      # `check` inclut les tests unitaires, le lint et le contrôle « aucune permission INTERNET » du manifest fusionné.
      - name: Tests, lint et contrôles du manifest
        run: ./gradlew check --stacktrace
      - name: APK debug
        run: ./gradlew :composeApp:assembleDebug --stacktrace
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: voltdeck-debug-apk
          path: composeApp/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: test-reports
          path: "**/build/reports/"
          if-no-files-found: ignore
          retention-days: 7

  # Jamais sur une PR : les minutes macOS sont facturées x10 sur un dépôt privé. Décision du fondateur
  # (VOL-1 §3 et §10) : rester dans les minutes gratuites du plan, aucun dépassement payant.
  ios:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Tests iOS (simulateur)
        run: ./gradlew iosSimulatorArm64Test --stacktrace
